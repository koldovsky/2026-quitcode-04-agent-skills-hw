# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config — review of QuitCode Workshop 4 homework PRs.
# Workshop: "Agent Skills: упаковка експертизи команди".
# Deliverables are agent skills (.claude/skills/**), evidence documents (docs/**)
# and the app changes the skills helped to make (app/**, lib/**, components/**).
# Scope note: Task C is the skill only; the «запит на кошторис» feature is built
# by the agent during the Task D A/B runs and carried over from run B.

language: "uk-UA"
tone_instructions: >
  Ментор воркшопу QuitCode. Відповідай українською, доброзичливо але вимогливо.
  Оцінюєш скіли агента, докази їх перевірки й код, який вони допомогли написати.
  Статуси: ✅ зроблено, ⚠️ частково, ❌ пропущено.

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  # ── File filters — every graded path listed explicitly ────────
  # The vendored Vercel skill is third-party text: its SKILL.md is reviewed
  # (evidence of a real, pinned install), its 70+ rule files are not.
  path_filters:
    - ".claude/**"
    - "!.claude/skills/vercel-react-best-practices/rules/**"
    - "!.claude/skills/vercel-react-best-practices/AGENTS.md"
    - "!.claude/skills/vercel-react-best-practices/README.md"
    - ".agents/**"
    - ".cursor/**"
    - "skills-lock.json"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "docs/**"
    - "app/**"
    - "lib/**"
    - "components/**"
    - "proxy.ts"
    - "next.config.ts"
    - "package.json"
    - ".env*"
    - ".gitignore"
    - "tools/**"
    - "materials/**"
    - ".github/**"
    - ".coderabbit.yaml"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/package-lock.json"

  # ── Path-specific review instructions ─────────────────────────
  path_instructions:
    - path: ".claude/skills/vercel-react-best-practices/**"
      instructions: |
        Task A — сторонній скіл, встановлений через `npx skills@1.7.0 add` з
        закріпленим тегом і `--copy`. Зміст файлів Vercel НЕ рев'юй (це чужий
        текст; rules/ і AGENTS.md навмисно виключені з рев'ю). Перевір лише:
        SKILL.md — справжній файл з frontmatter `name: vercel-react-best-practices`;
        шлях не є текстовим файлом зі шляхом (так виглядає закомічений symlink —
        ❌: у клоні на Windows скіла не видно). Будь-які правки учасника у файлах
        Vercel — ⚠️: чужий скіл оновлюють новим тегом, а не редагують.

    - path: "skills-lock.json"
      instructions: |
        Task A — lock-файл skills CLI. Перевір запис `vercel-react-best-practices`:
        `source: vercel-labs/agent-skills`, `ref` — незмінний тег (напр.
        `agent-skills-063bee9…`) або повний SHA коміту, а не гілка й не порожнє
        поле. Без `ref` — ❌ (версію не закріплено).

    - path: ".agents/**"
      instructions: |
        Друга копія скіла в `.agents/skills/` — ⚠️: з'являється, якщо встановити
        без `--copy` або з `-a cursor`. Cursor і так читає `.claude/skills/`, а дві
        копії розходяться після оновлення. Назви це прямо.

    - path: ".claude/skills/building-client-form/**"
      instructions: |
        Task B — власний скіл лише з інструкцій. Frontmatter: `name:
        building-client-form` (дорівнює назві теки, інакше ❌); `description`
        до 1024 символів — що робить скіл І коли застосовувати, з українськими
        фразами-тригерами; без «коли» — ⚠️. Тіло — конкретний патерн форми:
        Server Action перевіряє сесію/права й валідує дані ВСЕРЕДИНІ дії;
        useActionState; доступні помилки полів (label, aria-invalid,
        aria-describedby, role="alert"); введене не зникає після помилки; дія
        повертає лише `{ status, … }`, а не рядок з бази; жодних персональних
        даних у журналах; повільні побічні ефекти — в after(). Правила Vercel —
        посиланням за id (server-auth-actions, server-after-nonblocking,
        server-serialization…), а не копією тексту (копія — ⚠️). Розділ Verify з
        перевірюваними пунктами. Загальні фрази на кшталт «пиши якісні форми» —
        ⚠️.

    - path: ".claude/skills/integrating-n8n-webhooks/**"
      instructions: |
        Task C — власний скіл з довідкою й скриптами, упакований з
        materials/n8n-webhooks-brief.md. SKILL.md: `name` = назва теки,
        `description` з «що» і «коли» та тригерами; стислий контракт, чекліст,
        правила зупинки (без винятків «якщо задача потребує» — інакше ❌),
        розділ перевірки; деталі — у references/*.md з прямими посиланнями з
        SKILL.md. Дослівна копія записки в SKILL.md — ⚠️. Звір контракт із
        запискою: змінні N8N_WEBHOOK_BASE_URL, N8N_WEBHOOK_TOKEN,
        N8N_CALLBACK_SECRET, APP_BASE_URL — лише серверні; заголовки
        x-n8n-token, idempotency-key, x-correlation-id; підпис колбека
        `sha256=<hex HMAC-SHA256(secret, "${timestamp}.${rawBody}")>`, перевірка
        на сирому тілі з перевіркою довжини й timingSafeEqual, вікно 300 с,
        ідемпотентність; довгі воркфлоу — лише 202 + колбек; жодних
        /webhook-test/ URL. Правила Vercel server-auth-actions і
        server-after-nonblocking — посиланням, не копією. Статичне рев'ю — do
        NOT attempt to execute anything.

    - path: ".claude/skills/integrating-n8n-webhooks/scripts/**"
      instructions: |
        Скрипти скіла. check-contract.mjs: лише вбудовані модулі Node (без
        npm-залежностей); ≥ 5 перевірок, кожна з id і рядком PASS/FAIL; для
        FAIL — файл і рядок; ненульовий код виходу при будь-якому FAIL;
        підтримка `--root <тека>`; `--help`. Перевірки мають бути справжніми:
        перевірка, яка PASS за будь-якого коду, — ⚠️. Жоден скрипт не друкує
        значень секретів чи тіл запитів. mock-n8n.mjs — копія
        tools/mock-n8n.mjs, це нормально. Статичне рев'ю — do NOT run the
        scripts.

    - path: ".claude/**"
      instructions: |
        Інші зміни в .claude/ (налаштування, інші скіли). Налаштування з
        allowed-tools чи хуками, що дозволяють мережу або читання .env* без
        підтвердження людини, — ⚠️. Скіл у `.claude/skills/<тека>/` без SKILL.md
        або з `name`, що не дорівнює назві теки, — ❌.

    - path: "docs/skill-review*.md"
      instructions: |
        Task A (і бонус E1) — рев'ю стороннього скіла за чеклістом
        docs/templates/skill-review.md, зроблене ДО встановлення. Перевір, що
        заповнено власними спостереженнями, а не залишено шаблоном: як
        дивились без встановлення; скрипти, allowed-tools, команди під час
        рендеру, хуки/MCP/API-ключі, мережеві інструкції, посилання, приховані
        інструкції; аудити (і чому CLI їх показав чи ні); ліцензія й
        походження; 2–3 поради, звірені з документацією нашої версії; команда
        встановлення з тегом, `--copy`, що потрапило в git; вердикт. Для E1
        (docs/skill-review-n8n.md) — пакет czlonkowski/n8n-skills або
        n8n-io/skills, SHA переглянутого коміту, ознаки, що його НЕ
        встановлювали, і хоча б одне твердження пакета, звірене з
        materials/n8n-webhooks-brief.md.

    - path: "docs/verification.md"
      instructions: |
        Докази Task A–C. Task A: щонайменше два виправлення (більше — не
        помилка) — у кожного id правила Vercel і коміт; для ОДНОГО з них числа
        було/стало і як міряли (продакшн-збірка), для решти досить пояснення,
        що і чому змінили. Менше двох виправлень, виправлення без id правила
        або жодного виправлення з числами — ⚠️.
        Task B: запит у свіжій сесії, який НЕ називав скіл; чи спрацював скіл і
        як це видно (виклик Skill / читання SKILL.md); результат. Task C: скіл
        тут лише пакують — вимагати тут запит, на який спрацював скіл, або
        журнал мока НЕ треба (це Task D, docs/ab-validation.md). Для Task C
        перевір вивід check-contract.mjs на коді main (з FAIL) і вивід на
        фінальному коді (0 FAIL). Переказ шаблону без власних спостережень — ⚠️.
        Розділ «Cursor» — бонус E3.

    - path: "docs/ab-validation.md"
      instructions: |
        Task D — A/B-перевірка скіла integrating-n8n-webhooks. Увага до
        позначень: A — БЕЗ скіла, B — ЗІ скілом. Перевір: той самий запит з
        materials/ab-task.md без змін; дві нові сесії з однаковою моделлю й
        рівнем міркування; у копії A не було жодного скіла, у копії B — лише
        integrating-n8n-webhooks (перейменування скіла або особиста копія в
        ~/.claude/skills — ❌); tools/, materials/, docs/, README.md,
        .coderabbit.yaml і .github/ видалено з обох копій (вони описують контракт
        n8n; мок запускали з робочого репозиторію); однакова відповідь на
        уточнення. Для кожного прогону — видимі скіли, чи викликав агент скіл (для
        B), вивід check-contract.mjs на коді прогону (`--changed-since base` або
        з позначеними FAIL старого коду з базової лінії), журнал мока, час
        відповіді форми, чи є тіла або персональні дані в журналі сервера,
        змінені файли й діф у docs/ab/; таблиця порівняння; висновок, що
        спирається на ці дані. Чесне «різниці немає» з поясненням, звідки агент
        узяв контракт (загальні знання, документація Next.js, наявний код), —
        прийнятне. Висновок без чисел і журналів — ⚠️.
        Окремий розділ про перенесення: фіча «запит на кошторис» у гілці — це
        результат прогону B, і має бути сказано, як його перенесли (діф, злиття
        чи копіювання файлів), що довелось доробити руками, вивід
        check-contract.mjs на фінальному коді (0 FAIL) і що сценарій «форма →
        колбек → /quotes/<id>» відпрацював уже на гілці. Фіча без такого
        розділу (або написана в гілці замість прогону) — ⚠️.

    - path: "docs/ab/**"
      instructions: |
        Діфи-докази прогонів A/B (обов'язкові: a-without-skill.diff і
        b-with-skill.diff). Не рев'юй їх як код; переконайся лише, що вони
        відповідають опису в docs/ab-validation.md.

    - path: "docs/trigger-evals.md"
      instructions: |
        Бонус E2 — тест спрацювання власного скіла: ≥ 10 запитів, розділених на
        «має спрацювати» і «не має»; кожен — у новій сесії; результат по
        кожному; що змінено в description і повторний результат.

    - path: "docs/n8n-integrations.md"
      instructions: |
        Реєстр інтеграцій з n8n (у домашці — рекомендований крок, не
        оцінюється; відсутність файлу — не помилка). Якщо файл є: рядок на
        кожну подію — event, напрям, шлях n8n (/webhook/…, не /webhook-test/),
        режим відповіді, власник.

    - path: "app/**"
      instructions: |
        Код застосунку: виправлення Task A (щонайменше два) і фіча «запит на
        кошторис», перенесена з прогону B (Task D).
        Статичне рев'ю — do NOT run the build or the app. Кожне виправлення
        Task A має відповідати правилу Vercel, названому в коміті
        (`fix(<rule-id>)`), і документації Next.js 16: перевір, що зміна
        справді реалізує це правило і що порада не шкодить у Next.js 16.3.5;
        виправлення без id правила — ⚠️. Відомі пастки: `next/dynamic` з
        `ssr: false` у Server Component ламає збірку (лише в Client
        Components); барел-імпорти lucide-react НЕ є проблемою (Next.js
        оптимізує їх сам). Для коду n8n звір із контрактом
        materials/n8n-webhooks-brief.md: виклики n8n лише з серверного модуля
        з `import "server-only"`; заголовки x-n8n-token, idempotency-key,
        x-correlation-id; `signal: AbortSignal.timeout(...)`; повтори лише для
        мережевих помилок, 5xx і 524 з тим самим ключем; довгий воркфлоу —
        202 + колбек, Server Action не чекає n8n; колбек-роут читає сире тіло
        (`request.text()`), перевіряє час (±300 с) і підпис (перевірка довжини
        + timingSafeEqual, не ===) ДО JSON.parse, «застовплює»
        idempotency-key і звіряє його з jobId та подією з підписаного тіла,
        зберігає стан до відповіді 202; жодного
        `runtime = "edge"`, `NEXT_PUBLIC_N8N_*`, тестових URL; у журналах
        немає тіл, email, телефонів, токенів і підписів.

    - path: "lib/**"
      instructions: |
        Код застосунку: виправлення Task A (щонайменше два) і фіча «запит на
        кошторис», перенесена з прогону B (Task D).
        Статичне рев'ю — do NOT run the build or the app. Кожне виправлення
        Task A має відповідати правилу Vercel, названому в коміті
        (`fix(<rule-id>)`), і документації Next.js 16: перевір, що зміна
        справді реалізує це правило і що порада не шкодить у Next.js 16.3.5;
        виправлення без id правила — ⚠️. Відомі пастки: `next/dynamic` з
        `ssr: false` у Server Component ламає збірку (лише в Client
        Components); барел-імпорти lucide-react НЕ є проблемою (Next.js
        оптимізує їх сам). Для коду n8n звір із контрактом
        materials/n8n-webhooks-brief.md: виклики n8n лише з серверного модуля
        з `import "server-only"`; заголовки x-n8n-token, idempotency-key,
        x-correlation-id; `signal: AbortSignal.timeout(...)`; повтори лише для
        мережевих помилок, 5xx і 524 з тим самим ключем; довгий воркфлоу —
        202 + колбек, Server Action не чекає n8n; колбек-роут читає сире тіло
        (`request.text()`), перевіряє час (±300 с) і підпис (перевірка довжини
        + timingSafeEqual, не ===) ДО JSON.parse, «застовплює»
        idempotency-key і звіряє його з jobId та подією з підписаного тіла,
        зберігає стан до відповіді 202; жодного
        `runtime = "edge"`, `NEXT_PUBLIC_N8N_*`, тестових URL; у журналах
        немає тіл, email, телефонів, токенів і підписів.

    - path: "components/**"
      instructions: |
        Код застосунку: виправлення Task A (щонайменше два) і фіча «запит на
        кошторис», перенесена з прогону B (Task D).
        Статичне рев'ю — do NOT run the build or the app. Кожне виправлення
        Task A має відповідати правилу Vercel, названому в коміті
        (`fix(<rule-id>)`), і документації Next.js 16: перевір, що зміна
        справді реалізує це правило і що порада не шкодить у Next.js 16.3.5;
        виправлення без id правила — ⚠️. Відомі пастки: `next/dynamic` з
        `ssr: false` у Server Component ламає збірку (лише в Client
        Components); барел-імпорти lucide-react НЕ є проблемою (Next.js
        оптимізує їх сам). Для коду n8n звір із контрактом
        materials/n8n-webhooks-brief.md: виклики n8n лише з серверного модуля
        з `import "server-only"`; заголовки x-n8n-token, idempotency-key,
        x-correlation-id; `signal: AbortSignal.timeout(...)`; повтори лише для
        мережевих помилок, 5xx і 524 з тим самим ключем; довгий воркфлоу —
        202 + колбек, Server Action не чекає n8n; колбек-роут читає сире тіло
        (`request.text()`), перевіряє час (±300 с) і підпис (перевірка довжини
        + timingSafeEqual, не ===) ДО JSON.parse, «застовплює»
        idempotency-key і звіряє його з jobId та подією з підписаного тіла,
        зберігає стан до відповіді 202; жодного
        `runtime = "edge"`, `NEXT_PUBLIC_N8N_*`, тестових URL; у журналах
        немає тіл, email, телефонів, токенів і підписів.

    - path: "proxy.ts"
      instructions: |
        proxy.ts лише перенаправляє без cookie сесії — це не автентифікація.
        Якщо учасник покладається на нього замість перевірки сесії в Server
        Actions — ⚠️ (правило server-auth-actions).

    - path: ".env*"
      instructions: |
        У git має бути лише .env.example. Будь-який інший .env* файл у PR
        (.env.local тощо) — ❌ витік секретів. У .env.example — ключі контракту
        N8N_WEBHOOK_BASE_URL, N8N_WEBHOOK_TOKEN, N8N_CALLBACK_SECRET,
        APP_BASE_URL. Секрети (N8N_WEBHOOK_TOKEN, N8N_CALLBACK_SECRET, будь-який
        токен) — лише значення `change-me-…`. Адреси — локальний мок і
        застосунок (`http://127.0.0.1:5678/webhook`, `http://127.0.0.1:3000`);
        N8N_WEBHOOK_BASE_URL закінчується на /webhook. Жодного /webhook-test/ і
        жодного NEXT_PUBLIC_N8N_*.

    - path: "AGENTS.md"
      instructions: |
        AGENTS.md у WS4 не є завданням; зміни дозволені. Блок
        `<!-- BEGIN:nextjs-agent-rules -->` можна лишити. Перевір, що розділ
        безпеки не отримав винятків на кшталт «якщо задача цього потребує» —
        правило безпеки з таким винятком — ❌.

    - path: "CLAUDE.md"
      instructions: |
        CLAUDE.md має імпортувати AGENTS.md окремим рядком `@AGENTS.md`.
        Markdown-посилання замість імпорту — ❌.

    - path: "tools/**"
      instructions: |
        Мок n8n — інструмент перевірки A/B. Будь-яка зміна — ❌: це підганяння
        результату. Копію мока кладуть у скіл
        (.claude/skills/integrating-n8n-webhooks/scripts/), а не змінюють тут.

    - path: "materials/**"
      instructions: |
        Матеріали завдання. Будь-яка зміна, додавання чи видалення — ❌.

  # ── Pre-merge checks (grading) ────────────────────────────────
  pre_merge_checks:
    docstrings:
      mode: "off"

    title:
      mode: "warning"
      requirements: >
        PR title should follow: "WS4: <participant full name>".

    # The built-in description check takes only `mode` (it checks the PR
    # template is followed); the name/checklist requirement is a custom check.
    description:
      mode: "warning"

    custom_checks:
      - mode: "warning"
        name: "PR description — Ім'я та Прізвище"
        instructions: >
          Static review of the PR description only — do NOT review the diff or
          execute anything. The PR description MUST contain a filled-in
          "Ім'я та Прізвище" field under the "Учасник" heading with the
          participant's real full name (two words). An empty field, a leftover
          placeholder or template comment, or only a GitHub login is NOT
          acceptable — say so explicitly and ask the author to add it. Also
          check the task checklist under "Що зроблено (Definition of Done)" is
          filled in rather than left as unchecked template boxes. PASS if both
          hold; FAIL otherwise.


      - mode: "warning"
        name: "Task A — Vercel skill: review, pin, fixes"
        instructions: >
          Static review of the diff only — do NOT attempt to execute anything.
          Check that (1) docs/skill-review.md reviews the vercel-react-best-practices
          skill with the checklist from docs/templates/skill-review.md, filled with
          the participant's own findings: preview without installing; scripts,
          allowed-tools, render-time commands, hooks, network instructions, links
          and hidden instructions; audits; licence and provenance; advice checked
          against the Next.js 16 docs; the pinned install command; a verdict.
          (2) .claude/skills/vercel-react-best-practices/SKILL.md is added as a
          real file with `name: vercel-react-best-practices` (not a symlink text
          file), and skills-lock.json pins source vercel-labs/agent-skills to an
          immutable ref — a release tag or a full commit SHA, not a branch. The
          vendored rules/ files and AGENTS.md are excluded from review on purpose;
          do not report them as missing. (3) docs/verification.md lists at least
          two fixes (two are enough; more is not an error), each with a Vercel
          rule id and the commit, and for ONE of them before/after numbers plus
          how they were measured (the others only need the rule id and a short
          explanation of what changed and why); the
          matching code changes under app/, components/ or lib/ implement those
          rules correctly for Next.js 16. PASS if all three hold; FAIL if the
          review is missing or left as a template, the install is unpinned or a
          link, there are fewer than two fixes with rule ids, or none of them
          carries before/after numbers.

      - mode: "warning"
        name: "Task B — building-client-form skill"
        instructions: >
          Static review of the diff only. Check .claude/skills/building-client-form/SKILL.md
          exists with `name: building-client-form` (equal to the folder) and a
          description under 1024 characters that states what the skill does AND
          when to use it, with Ukrainian trigger phrases. The body must be a
          concrete form pattern: a Server Action that checks the session and
          permissions and validates inside the action, useActionState, accessible
          field errors (label, aria-invalid, aria-describedby, role="alert"),
          values kept after an error, a small `{ status, … }` return value, no
          personal data in logs, slow side effects in after(). It must reference
          Vercel rules by id instead of copying them and end with a Verify
          section. Check docs/verification.md records a plain request made in a
          fresh session without naming the skill, whether the skill triggered
          and how that was observed, and the result. PASS if both hold; FAIL
          otherwise.

      - mode: "warning"
        name: "Task C — integrating-n8n-webhooks skill"
        instructions: >
          Static review of the diff only — do NOT run the scripts. Check
          .claude/skills/integrating-n8n-webhooks/ has: SKILL.md with `name`
          equal to the folder and a what-plus-when description; a concise
          contract, a checklist, stop rules without task-dependent exceptions,
          and a verification section; details in references/*.md linked directly
          from SKILL.md rather than a verbatim copy of
          materials/n8n-webhooks-brief.md; scripts/check-contract.mjs using only
          Node built-ins, with at least five checks, each printing an id and
          PASS/FAIL, file:line for each FAIL, a non-zero exit code on any
          failure, a --root option and --help.
          The contract in the skill must match the brief (server-only N8N_* env
          vars; x-n8n-token, idempotency-key and x-correlation-id headers; the
          callback signature sha256=HMAC-SHA256(secret, "<timestamp>.<raw body>")
          verified on the raw body with a length check and timingSafeEqual, a
          300 s window and idempotency; async 202 + callback for long workflows;
          no /webhook-test/ URLs). Task C is the skill only: the «запит на
          кошторис» feature is NOT part of it — do not ask for the feature, for a
          request that triggered the skill or for a mock log here (that is Task D,
          docs/ab-validation.md). Check docs/verification.md records the
          check-contract.mjs output on main (with failures) and the output on the
          final code (0 FAIL). PASS if the skill, the checker and this evidence
          are present and consistent; FAIL otherwise.

      - mode: "warning"
        name: "Task D — A/B validation and quote feature"
        instructions: >
          Static review of the diff only. Polarity: run A is WITHOUT the
          integrating-n8n-webhooks skill, run B is WITH it. Check
          docs/ab-validation.md documents both runs of the unchanged prompt from
          materials/ab-task.md, each in a fresh session with the same model and
          effort; the run-A copy had no project skills at all and the run-B copy
          only integrating-n8n-webhooks (renaming the skill or leaving a personal
          copy in ~/.claude/skills does not count); tools/, materials/, docs/,
          README.md, .coderabbit.yaml and .github/ were removed from both copies
          (they describe the n8n contract; the mock was run from the working
          repository); the same reply to any clarifying question. For each run it
          must record the skills visible at the start, whether run B invoked the
          skill, the check-contract.mjs output for the run's own code (ids and
          PASS/FAIL, via --changed-since base or with the baseline's pre-existing
          FAILs marked as such), the mock log of the form → callback → /quotes/[id] scenario
          (URL, auth=, idempotency=, callback status), the form response time,
          whether the server log contains request bodies or personal data, and
          the changed files, followed by a comparison table and a conclusion
          grounded in those observations. Both diffs are required:
          docs/ab/a-without-skill.diff and docs/ab/b-with-skill.diff. An honest "no difference" conclusion that explains where the
          agent learned the contract (for example general knowledge, the Next.js
          docs or existing code) is acceptable. docs/n8n-integrations.md is a
          recommended step, not graded: do not fail this check without it. The feature is built in these runs, not in the branch:
          check that the «запит на кошторис» feature (a /quotes/new page, a
          Server Action, a callback Route Handler and a /quotes/[id] status page)
          is present under app/, components/ and lib/ and follows the contract of
          materials/n8n-webhooks-brief.md, and that docs/ab-validation.md says
          how the run-B result was carried into the branch (diff, merge or
          copied files), what had to be finished by hand, the check-contract.mjs
          output on the final code (0 FAIL) and that the form → callback →
          /quotes/[id] scenario was re-run on the branch. PASS if both runs and
          the carried-over feature are documented this way; FAIL otherwise.

      - mode: "warning"
        name: "Task E — bonus (one of three)"
        instructions: >
          Optional bonus — absence is NOT a failure. If present, check one of:
          (E1) docs/skill-review-n8n.md reviews czlonkowski/n8n-skills or
          n8n-io/skills WITHOUT installing it, following
          docs/templates/skill-review.md, with the reviewed commit SHA, findings
          on hooks, MCP servers and API keys, and at least one claim of the pack
          checked against materials/n8n-webhooks-brief.md; (E2)
          docs/trigger-evals.md has at least ten prompts for an own skill, split
          into should-trigger and should-not-trigger, each run in a fresh
          session, with results and any description change; (E3) a "Cursor"
          section in docs/verification.md records which skills Cursor saw and
          whether they triggered on the Task B request and on the prompt from
          materials/ab-task.md. PASS if one option is complete.

      - mode: "warning"
        name: "Protected paths and secrets"
        instructions: >
          Static review of the diff only. FAIL if the PR modifies, adds or
          deletes any file under tools/ or materials/, changes .coderabbit.yaml
          or anything under .github/, commits any .env* file other than
          .env.example, gives a secret key in .env.example (N8N_WEBHOOK_TOKEN,
          N8N_CALLBACK_SECRET or any other token or secret) a value other than a
          change-me-… placeholder, or puts a /webhook-test/ URL there. Local
          URLs such as http://127.0.0.1:5678/webhook and http://127.0.0.1:3000
          are expected. PASS otherwise. New skills, docs, app fixes and the
          quote feature elsewhere are expected and fine.

